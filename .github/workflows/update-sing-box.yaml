name: Update sing-box

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main

      - name: Update sing-box
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "null" ] || exit 1

          VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' sing-box/Makefile)

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            HASH=$(curl -fsSL "https://codeload.github.com/SagerNet/sing-box/tar.gz/v${VERSION}" | sha256sum | awk '{print $1}')
            [ -n "$HASH" ] || exit 1

            sed -i "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=${VERSION}/" sing-box/Makefile
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" sing-box/Makefile
            sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" sing-box/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" sing-box/Makefile

            git config user.name "yahuisme"
            git config user.email "40222380+yahuisme@users.noreply.github.com"
            git commit -am "chore: update sing-box to ${VERSION}"
            git push
          fi
