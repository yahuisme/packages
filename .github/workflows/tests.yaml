name: Regression Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'luci-app-homeproxy/root/etc/homeproxy/resources/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate package metadata
        run: |
          set -eu
          for mk in luci-app-*/Makefile; do
            # shellcheck disable=SC2016
            grep -q '^include \$(TOPDIR)/feeds/luci/luci.mk' "$mk"
            # luci.mk accepts either an explicit LUCI_PKGNAME or PKG_NAME.
            grep -qE '^(LUCI_PKGNAME|PKG_NAME):=' "$mk"
            grep -q '^LUCI_PKGARCH:=' "$mk"
            grep -q '^PKG_MAINTAINER:=' "$mk"
          done
      - name: Check official stable release filtering
        run: python3 .github/tests/test_package_update.py
      - name: JavaScript and shell syntax
        run: |
          set -eu
          find luci-app-*/htdocs -name '*.js' -print0 |
            while IFS= read -r -d '' js; do node --check "$js"; done
          # .uc is ucode, not POSIX shell; only shell scripts go through sh -n.
          find luci-app-*/root -type f \( -path '*/libexec/*' -o -path '*/init.d/*' -o -name '*.sh' \) ! -name '*.uc' -print0 |
            sort -zu | while IFS= read -r -d '' sh; do
              head -1 "$sh" | grep -q '^#!' || continue
              sh -n "$sh"
            done
      - name: Reject document-wide mutation observers in views
        run: |
          set -eu
          # Views must scope lifecycle observers to the view container; a
          # document.body/documentElement subtree observer fires on every write.
          if grep -rn "observe(document\.\(body\|documentElement\)[^)]*subtree" luci-app-*/htdocs; then
            echo 'document-wide subtree observer found'; exit 1
          fi

  luci-tests:
    name: LuCI view and backend suites
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
        with:
          # Native editor parity replays its immutable historical source.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare scratch
        run: |
          mkdir -p "$RUNNER_TEMP/packages-scratch"
          echo "TMPDIR=$RUNNER_TEMP/packages-scratch" >> "$GITHUB_ENV"
      - name: Checkout pinned LuCI resources
        uses: actions/checkout@v7
        with:
          repository: openwrt/luci
          ref: a8c110bed82375b69eb3881b2e54e617520e8c7d
          path: .luci
          fetch-depth: 1
      - name: Stage verified prebuilt runtime and gettext
        run: |
          set -eu
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y gettext
          python3 .github/scripts/setup-test-tools.py --dest "$RUNNER_TEMP/packages-tools"
          . "$RUNNER_TEMP/packages-tools/env.sh"
          # Reuse the exact same exported paths in subsequent steps.
          for key in OPENWRT_SOURCE OPENWRT_TOOLS UCODE_LIB_DIR PO2LMO REAL_UCI UCI_BIN; do
            printenv "$key" | sed "s|^|$key=|" >> "$GITHUB_ENV"
          done
          echo "$OPENWRT_TOOLS/bin" >> "$GITHUB_PATH"
      - name: Install jsdom
        run: |
          # Pinned to the version used by the native computed-style assertions.
          npm install --prefix "$RUNNER_TEMP/packages-node" --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          echo "NODE_PATH=$RUNNER_TEMP/packages-node/node_modules" >> "$GITHUB_ENV"
      - name: Run suites
        env:
          LUCI_RESOURCE_DIR: ${{ github.workspace }}/.luci/modules/luci-base/htdocs/luci-static/resources
        run: ./.github/scripts/run-tests.sh
      - name: Verify private key ownership
        run: |
          # This isolated fixture needs uid switching; no service is started.
          sudo env "PATH=$PATH" "UCODE_LIB_DIR=$UCODE_LIB_DIR" "TMPDIR=$TMPDIR" \
            PYTHONDONTWRITEBYTECODE=1 python3 luci-app-homeproxy/tests/test_certificate_cleanup.py
      - name: Verify native subscription RPC worker
        run: |
          sudo env "OPENWRT_ROOTFS=$OPENWRT_TOOLS/rootfs.tar.gz" \
            "TMPDIR=$TMPDIR" PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/subscription-rpc-native.py
      - name: Verify native resource RPC background jobs
        run: |
          sudo env "OPENWRT_ROOTFS=$OPENWRT_TOOLS/rootfs.tar.gz" \
            "OPENWRT_DIGEST=$OPENWRT_TOOLS/runtime/usr/lib/ucode/digest.so" \
            "TMPDIR=$TMPDIR" PYTHONDONTWRITEBYTECODE=1 \
            python3 tests/resource-rpc-native.py
