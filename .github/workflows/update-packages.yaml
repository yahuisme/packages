name: Update Packages

on:
  schedule:
    # 每天香港时间 06:00 (UTC 22:00) 运行
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Git Identity
        run: |
          git config user.name "yahuisme"
          git config user.email "40222380+yahuisme@users.noreply.github.com"

      - name: Update sing-box
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          set -o pipefail
          LATEST_TAG=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid sing-box release tag: $LATEST_TAG" >&2
            exit 1
          fi
          VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' sing-box/Makefile)

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            HASH=$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
              "https://codeload.github.com/SagerNet/sing-box/tar.gz/v${VERSION}" | sha256sum | awk '{print $1}')
            test "${#HASH}" -eq 64
            sed -i "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=${VERSION}/" sing-box/Makefile
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" sing-box/Makefile
            sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" sing-box/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" sing-box/Makefile
            git add sing-box/
            git commit -m "chore: update sing-box to ${VERSION}"
            echo "sing-box updated to ${VERSION}"
          fi

      - name: Update HomeProxy Resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          set -o pipefail
          RES_DIR="luci-app-homeproxy/root/etc/homeproxy/resources"
          [ -d "$RES_DIR" ] || exit 0

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          # Use the packaged core's real SRS decoder; never start the daemon.
          SB_VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' sing-box/Makefile)
          gh release download "v$SB_VERSION" --repo SagerNet/sing-box \
            --pattern "sing-box-$SB_VERSION-linux-amd64.tar.gz" --dir "$TMP_DIR"
          tar -xzf "$TMP_DIR/sing-box-$SB_VERSION-linux-amd64.tar.gz" -C "$TMP_DIR"
          SING_BOX="$TMP_DIR/sing-box-$SB_VERSION-linux-amd64/sing-box"

          # Match runtime: resolve rule-set to a commit, then fetch that commit.
          # Stage and decode BOTH resources before touching the package files.
          for KIND in geoip geosite; do
            gh api "repos/SagerNet/sing-$KIND/commits/rule-set" > "$TMP_DIR/commit.json"
            VERSION=$(jq -er '.sha' "$TMP_DIR/commit.json")
            DATE=$(jq -er '.commit.committer.date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$")) | .[0:10]' "$TMP_DIR/commit.json")
            [ "${#VERSION}" -eq 40 ] || exit 1
            case "$VERSION" in *[!0-9a-f]*) exit 1 ;; esac
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 60 \
              "https://raw.githubusercontent.com/SagerNet/sing-$KIND/$VERSION/$KIND-cn.srs" \
              -o "$TMP_DIR/${KIND}_cn.srs"
            BLOB=$(gh api "repos/SagerNet/sing-$KIND/contents/$KIND-cn.srs?ref=$VERSION" --jq .sha)
            [[ "$BLOB" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [ "$(git hash-object --no-filters "$TMP_DIR/${KIND}_cn.srs")" = "$BLOB" ] || exit 1
            "$SING_BOX" rule-set match -f binary "$TMP_DIR/${KIND}_cn.srs" 192.0.2.1 >/dev/null
            printf '%s %s\n' "$DATE" "$VERSION" > "$TMP_DIR/${KIND}_cn.ver"
          done
          cp "$TMP_DIR/geoip_cn.srs" "$TMP_DIR/geoip_cn.ver" \
             "$TMP_DIR/geosite_cn.srs" "$TMP_DIR/geosite_cn.ver" "$RES_DIR/"

          if ! git diff --quiet "$RES_DIR"; then
            git add "$RES_DIR"
            git commit -m "chore: update HomeProxy rule-set snapshots"
            echo "HomeProxy resources updated."
          fi

      - name: Push Changes
        run: |
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
          fi
