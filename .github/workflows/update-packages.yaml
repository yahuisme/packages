name: Update Packages

on:
  schedule:
    # 每天香港时间 02:00 (UTC 前一天 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate resources and stable core compatibility before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-homeproxy.py

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config user.name "yahuisme"
          git config user.email "40222380+yahuisme@users.noreply.github.com"
          git add -- sing-box/Makefile README.md
          if ! git diff --cached --quiet; then
            VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' sing-box/Makefile)
            git diff --cached --check
            git commit -m "chore: update sing-box ${VERSION}"
          fi
          RESOURCES=luci-app-homeproxy/root/etc/homeproxy/resources
          git add -- "$RESOURCES/geoip_cn.srs" "$RESOURCES/geoip_cn.ver" \
                    "$RESOURCES/geosite_cn.srs" "$RESOURCES/geosite_cn.ver"
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "chore: update HomeProxy resources"
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse '@{upstream}')" ]; then
            git push
          fi
