name: Update Packages

on:
  schedule:
    # 每天香港时间 02:00 (UTC 前一天 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update resources and reviewed stable sing-box
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update-homeproxy.py

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config user.name "yahuisme"
          git config user.email "40222380+yahuisme@users.noreply.github.com"
          for PACKAGE in sing-box luci-app-homeproxy; do
            git add -A -- "$PACKAGE"
            if git diff --cached --quiet; then continue; fi
            if [ "$PACKAGE" = sing-box ]; then
              VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' "$PACKAGE/Makefile")
              git commit -m "chore: update sing-box ${VERSION}"
            else
              VERSION=$(python3 -c 'import pathlib,re,subprocess; paths=subprocess.check_output(["git","diff","--cached","--name-only","--diff-filter=AM","--","luci-app-homeproxy"],text=True).splitlines(); versions=[pathlib.Path(p).read_text().split()[0] for p in paths if p.endswith(".ver")]; assert versions and all(re.fullmatch(r"[0-9]{14}",v) for v in versions), "Missing or invalid resource version"; print(max(versions))')
              git commit -m "chore: update resources ${VERSION}"
            fi
          done
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse '@{upstream}')" ]; then
            git push
          fi
