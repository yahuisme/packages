name: Update Packages

on:
  schedule:
    # 每天香港时间 06:00 (UTC 22:00) 运行
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Git Identity
        run: |
          git config user.name "yahuisme"
          git config user.email "40222380+yahuisme@users.noreply.github.com"

      - name: Update sing-box
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          set -o pipefail
          LATEST_TAG=$(gh api repos/SagerNet/sing-box/releases/latest --jq .tag_name)
          case "$LATEST_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) VERSION="${LATEST_TAG#v}" ;;
            *) echo "Invalid sing-box release tag: $LATEST_TAG" >&2; exit 1 ;;
          esac
          CURRENT_VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' sing-box/Makefile)

          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            HASH=$(curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
              "https://codeload.github.com/SagerNet/sing-box/tar.gz/v${VERSION}" | sha256sum | awk '{print $1}')
            test "${#HASH}" -eq 64
            sed -i "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=${VERSION}/" sing-box/Makefile
            sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" sing-box/Makefile
            sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" sing-box/Makefile
            sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" sing-box/Makefile
            git add sing-box/
            git commit -m "chore: update sing-box to ${VERSION}"
            echo "sing-box updated to ${VERSION}"
          fi

      - name: Update HomeProxy Resources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          set -o pipefail
          RES_DIR="luci-app-homeproxy/root/etc/homeproxy/resources"
          [ -d "$RES_DIR" ] || exit 0

          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT

          # 1. Update China IP rule set (geoip_cn.srs)
          GEOIP_VER=$(gh api repos/SagerNet/sing-geoip/releases/latest --jq .tag_name 2>/dev/null || echo "")

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            "https://cdn.jsdelivr.net/gh/SagerNet/sing-geoip@rule-set/geoip-cn.srs" -o "$TMP_DIR/geoip_cn.srs"
          [ "$(head -c 3 "$TMP_DIR/geoip_cn.srs")" = "SRS" ] || exit 1
          cp -f "$TMP_DIR/geoip_cn.srs" "$RES_DIR/"
          if [ -n "$GEOIP_VER" ] && [ "$GEOIP_VER" != "latest" ]; then
            echo "$GEOIP_VER" > "$RES_DIR/geoip_cn.ver"
          fi

          # 2. Update geosite_cn.srs
          GEOSITE_VER=$(gh api repos/SagerNet/sing-geosite/releases/latest --jq .tag_name 2>/dev/null || echo "")

          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 \
            "https://cdn.jsdelivr.net/gh/SagerNet/sing-geosite@rule-set/geosite-cn.srs" -o "$TMP_DIR/geosite_cn.srs"
          [ "$(wc -c < "$TMP_DIR/geosite_cn.srs")" -gt 32 ] || exit 1
          cp -f "$TMP_DIR/geosite_cn.srs" "$RES_DIR/"
          if [ -n "$GEOSITE_VER" ] && [ "$GEOSITE_VER" != "latest" ]; then
            echo "$GEOSITE_VER" > "$RES_DIR/geosite_cn.ver"
          fi

          if ! git diff --quiet "$RES_DIR"; then
            git add "$RES_DIR"
            RES_LABEL="${GEOIP_VER:-${GEOSITE_VER:-}}"
            if [ -n "$RES_LABEL" ]; then
              git commit -m "chore: update resources to ${RES_LABEL}"
            else
              git commit -m "chore: update resources"
            fi
            echo "HomeProxy resources updated."
          fi

      - name: Push Changes
        run: |
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push
          fi
