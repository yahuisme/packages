name: Update Packages

on:
  schedule:
    # 每天香港时间 02:00 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync HomeProxy
        run: |
          set -euo pipefail
          git fetch --depth=1 https://github.com/VIKINGYFY/packages.git main
          git cat-file -e FETCH_HEAD:luci-app-homeproxy/Makefile
          rm -rf luci-app-homeproxy
          git archive FETCH_HEAD luci-app-homeproxy | tar -x

      - name: Update sing-box
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh api repos/SagerNet/sing-box/releases/latest \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid sing-box stable release: $LATEST_TAG" >&2
            exit 1
          fi
          VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' sing-box/Makefile)
          if [ "$VERSION" != "$CURRENT_VERSION" ]; then
            ARCHIVE=$(mktemp)
            trap 'rm -f "$ARCHIVE"' EXIT
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
              "https://codeload.github.com/SagerNet/sing-box/tar.gz/$LATEST_TAG" -o "$ARCHIVE"
            tar -tzf "$ARCHIVE" >/dev/null
            HASH=$(sha256sum "$ARCHIVE" | cut -d' ' -f1)
            sed -i \
              -e "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=${VERSION}/" \
              -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" \
              -e "s/^PKG_HASH:=.*/PKG_HASH:=${HASH}/" \
              -e 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' sing-box/Makefile
          fi

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config user.name "yahuisme"
          git config user.email "40222380+yahuisme@users.noreply.github.com"
          git add -A -- luci-app-homeproxy sing-box
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync packages"
            git push
          fi
